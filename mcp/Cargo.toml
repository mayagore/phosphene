[package]
name = "phosphene"
version = "1.0.1"
edition = "2024"
description = "phosphene's MCP half — design exploration and judgment tools"
license = "MIT"
repository = "https://github.com/mayagore/phosphene"
# Plugins ship as container images built from a git tag, never as
# crates.
publish = false

[[bin]]
name = "phosphene"
path = "src/main.rs"

[dependencies]
# Everything that is the same for every ObjectiveAI plugin. It also
# re-exports `objectiveai_sdk`, `rmcp` and `sqlx`, so none of those are
# listed here — a second copy of any of them would be a different set
# of traits and would not fit the APIs above.
objectiveai-mcp-plugin-framework = "2.2.15"
# Only to consume the response stream from a CLI command.
futures = "0.3.33"
# Embedding the font kit's woff2 payloads into generated documents.
base64 = "0.22"
# `rmcp` is deliberately NOT a direct dependency: the framework
# re-exports the exact one it was built against, so the two can never
# skew into a `ToolRouter<S>` that does not fit `serve`. The
# `#[tool_router]`/`#[tool]` macros resolve through the `use` in
# `main.rs`.
schemars = "1.2.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
# `sync` is the OnceCell guarding table creation (back in use since the
# postgres reversal — docs/scoring.md §4); `time` is the inter-chunk stall
# watchdog in `run_agent`.
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread", "sync", "time"] }

[profile.release]
# Small, fast-enough image binary.
opt-level = "s"
strip = true
